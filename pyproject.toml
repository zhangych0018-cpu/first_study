[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sws-bayesian-optimization"
version = "0.1.0"
description = "Manufacturing-aware multi-objective Bayesian inverse design for G-band SWS."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "OpenAI Codex"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.3",
  "scipy>=1.13",
  "torch>=2.8",
  "botorch>=0.7",
  "gpytorch>=1.13",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "pytest>=7.0",
]

[tool.setuptools]
packages = ["sws_bo"]
